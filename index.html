<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: mobile-first ward app — deep-green header band, single column cards, bottom tab bar per audit module */
:root{
  --bg:#EFF5F2; --surface:#FFFFFF; --surface2:#E6EFEA; --ink:#0F2A20; --muted:#587066; --line:#D5E3DB;
  --brand:#12925A; --brand-soft:#DDF3E8; --band:#0B4D38; --band-ink:#EFFAF4; --band-muted:#A8D8BF;
  --grad:linear-gradient(135deg,#0A4A36 0%,#0F7A4B 55%,#1AA463 100%);
  --blue:#2C78D4; --blue-soft:#E4EEFB; --rose:#D13F4A; --rose-soft:#FCE7E8; --amber:#E2A10F; --amber-soft:#FDF1D3;
  --ok:#1C9A57; --ok-soft:#DDF3E6; --warn:#C98F00; --warn-soft:#FBF0D2; --bad:#CF3F3F; --bad-soft:#F9E0E0; --off:#9AA9A5;
  --shadow:0 1px 2px rgba(16,35,31,.06),0 6px 20px rgba(16,35,31,.06);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--band)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

/* ---------- Splash ---------- */
#splash{position:fixed;inset:0;z-index:100;background:#0B4A37;transition:opacity .5s;overflow:hidden}
#splash.out{opacity:0;pointer-events:none}
#splash .spbg{position:absolute;inset:-60px;background-size:cover;background-position:center;filter:blur(40px) brightness(.7) saturate(1.2);transform:scale(1.1)}
#splash img{position:relative;width:100%;height:100%;object-fit:cover;object-position:center top;display:block;max-width:100%;animation:spIn .8s ease both}
@media (min-aspect-ratio:3/4){#splash img{object-fit:contain;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 calc(50% - 26vh),#000 calc(50% + 26vh),transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 calc(50% - 26vh),#000 calc(50% + 26vh),transparent 100%)}}
@keyframes spIn{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#splash img{animation:none}}
.mark{display:inline-block;line-height:0}
.logo-img{display:block;flex:none;border-radius:23%;object-fit:cover;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.wbanner{position:relative;border-radius:22px;overflow:hidden;line-height:0;box-shadow:var(--shadow)}
.wbanner img{width:100%;display:block;max-width:100%}
.wbanner .chip-w{position:absolute;left:5.5%;bottom:9%;line-height:1.2;background:rgba(255,255,255,.92);color:#0B6B41;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700}
.hbanner{width:100%;max-width:100%;display:block;border-radius:18px;box-shadow:var(--shadow)}
.mbanner{border-radius:18px;padding:16px;display:flex;align-items:center;gap:14px;color:#fff;box-shadow:var(--shadow);min-height:110px}
.mbanner .mb-t{flex:1;min-width:0}.mbanner .mb-s{font-size:12.5px;font-weight:700;opacity:.9}
.mbanner .mb-h{font-family:var(--f-display);font-weight:800;font-size:23px;line-height:1.1}
.mbanner .mb-x{font-size:11.5px;opacity:.85;margin-top:4px}
.mbanner .aimg{border-radius:18px}
@media (min-width:900px){
  body .top .wrap{min-height:88px;padding-block:16px;gap:16px}
  body .top h1{font-size:27px}
  body .top .sub{font-size:15px}
  body .top .logo-img{width:56px;height:56px}
  body .top .icon-btn{width:48px;height:48px;border-radius:14px}
  .wbanner{max-width:720px;width:100%;margin-inline:auto}
  .hbanner{max-height:150px;object-fit:cover;object-position:left center}
}

/* ---------- Home ---------- */
.banner{background:var(--grad);color:#fff;border-radius:22px;padding:20px 18px;display:flex;align-items:center;gap:8px;position:relative;overflow:hidden;min-height:150px}
.banner::after{content:"";position:absolute;right:-40px;bottom:-60px;width:220px;height:140px;border-radius:50%;background:rgba(255,255,255,.08)}
.banner .tx{flex:1;min-width:0;position:relative;z-index:1}
.banner h2{font-size:25px;font-weight:800}
.banner p{margin:4px 0 0;color:#D5F1E1;font-size:14px;line-height:1.35}
.banner .chip-w{display:inline-block;margin-top:12px;background:rgba(255,255,255,.16);border-radius:999px;padding:4px 11px;font-size:12px;font-weight:600}
.banner svg{flex:none;position:relative;z-index:1}
.sect-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sect-h h2{font-size:16.5px;display:flex;align-items:center;gap:8px}
.sect-h h2 i{width:18px;height:18px;border-radius:5px;background:var(--brand);display:inline-block}
.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mtile{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:14px 6px 12px;display:flex;flex-direction:column;align-items:center;gap:9px;font-size:13px;font-weight:600;color:var(--ink);text-align:center;position:relative;line-height:1.2}
.mtile:hover{border-color:var(--brand);background:var(--brand-soft)}
.mtile .mi{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;color:#fff}
.mi.g{background:linear-gradient(135deg,#1FB36A,#0E8048)} .mi.b{background:linear-gradient(135deg,#4A93E6,#2366C2)} .mi.y{background:linear-gradient(135deg,#F7BE36,#DE980B)}
.badge{position:absolute;top:6px;right:8px;min-width:20px;height:20px;border-radius:10px;background:var(--bad);color:#fff;font-size:11.5px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.srow{display:flex;align-items:center;gap:12px;border-radius:16px;padding:12px;width:100%;border:0;text-align:left;color:var(--ink)}
.srow .si{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;color:#fff;flex:none}
.srow .b{flex:1;min-width:0}
.srow .t1{font-weight:700;font-size:14.5px}
.srow .t2{font-size:12.5px;color:var(--muted);margin-top:1px}
.srow.g{background:var(--brand-soft)} .srow.g .t1{color:#0B6B41}
.srow.b{background:var(--blue-soft)} .srow.b .t1{color:#1F5FAF}
.srow.y{background:var(--amber-soft)} .srow.y .t1{color:#8A6100}
.srow .pv{display:flex;flex-direction:column;align-items:flex-end;gap:6px;min-width:80px}
.srow .pv b{font-family:var(--f-display);font-size:17px;color:#0B6B41}
.srow .pv .track{width:80px;height:7px;background:rgba(255,255,255,.8)}
.srow .pv .track i{background:var(--brand)}
.bell{position:relative}
.bell .badge{top:-5px;right:-5px;border:2px solid #0F7A4B}
.ev{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.evi{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0;overflow:hidden;display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--ink);max-width:100%}
.evi img{width:58px;height:44px;object-fit:cover;display:block}
.evi span{padding:6px 9px 6px 0;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.evi .fi{width:44px;height:44px;display:grid;place-items:center;background:var(--surface2);color:var(--brand);flex:none}
.evi .rm{border:0;background:transparent;color:var(--bad);padding:0 8px 0 0;font-size:18px;line-height:1}
.icard{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.icard .top1{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.icard .ttl{font-weight:700;font-size:14.5px}
.icard textarea{min-height:64px;resize:vertical}
.fixbox{background:var(--surface2);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}

/* ---------- Header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--grad);color:var(--band-ink)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:12px;min-height:60px}
.top .t{flex:1;min-width:0}
.top h1{font-size:19px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sub{font-size:12.5px;color:var(--band-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{border:0;background:rgba(255,255,255,.1);color:var(--band-ink);width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.icon-btn:hover{background:rgba(255,255,255,.18)}
.minimark{width:36px;height:36px;border-radius:11px;background:var(--brand);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;color:#fff;font-size:15px;flex:none}
.demo-band{background:var(--warn-soft);color:var(--ink);font-size:12.5px}
.demo-band .wrap{padding-block:6px}

main{padding-block:18px 110px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:640px){.grid4{grid-template-columns:repeat(2,1fr)}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.card h2{font-size:17px;font-weight:700}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}

/* ---------- Forms ---------- */
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;font-size:15px;color:var(--ink);min-width:0}
.inp:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px var(--brand-soft)}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.pw{position:relative}
.pw .inp{padding-right:48px}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--muted);width:38px;height:38px;border-radius:10px;display:grid;place-items:center}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--surface2);color:var(--ink)}
.btn.pri{background:var(--brand);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.sm{padding:8px 12px;font-size:13.5px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.linkbtn{border:0;background:none;color:var(--brand);font-weight:600;padding:0;font-size:13.5px}

/* ---------- Login ---------- */
.login{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding-block:28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--bg)}
.login-ban{width:100%;max-width:480px;border-radius:20px;display:block;box-shadow:var(--shadow)}
.login-card{max-width:480px;width:100%;margin-inline:auto;box-shadow:var(--shadow);padding:22px}
.login-brand{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding-bottom:4px}
.login-brand h1{font-size:25px;font-weight:800}
.login-brand p{margin:0;color:var(--muted);font-size:12.5px}
.bldseg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bldseg button{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 8px;font-weight:700;font-size:14.5px;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:2px}
.bldseg button small{font-weight:500;font-size:11.5px;color:var(--muted)}
.bldseg button.on{border-color:var(--brand);background:var(--brand-soft);color:#0B6B41;box-shadow:0 0 0 3px var(--brand-soft)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface2);border-radius:12px;padding:4px;gap:4px;margin-bottom:18px}
.seg button{border:0;background:transparent;padding:9px;border-radius:9px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.hint{background:var(--brand-soft);border-radius:12px;padding:12px 14px;font-size:13.5px}
.hint b{font-family:var(--f-mono);font-weight:700}
.check{display:flex;align-items:center;gap:8px;font-size:14px}
.check input{width:18px;height:18px;accent-color:var(--brand)}

/* ---------- Home tiles ---------- */
.tile{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:16px;color:var(--ink)}
.tile:hover:not(:disabled){border-color:var(--brand)}
.tile:disabled{cursor:default}
.tile .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;flex:none;background:var(--brand-soft);color:var(--brand)}
.tile.soon{opacity:.8}
.tile.soon .ic{background:var(--surface2);color:var(--muted)}
.tile h3{font-size:17px;font-weight:700}
.tile p{margin:3px 0 0;font-size:13.5px;color:var(--muted)}
.tile .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}

.secgrid .bar-row .lbl{white-space:normal;overflow:visible}
.miss-sum{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.miss-n{font-family:var(--f-display);font-weight:800;font-size:30px;color:var(--bad)}
.miss-dd{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.miss-dd summary{cursor:pointer;font-weight:700;color:var(--brand);font-size:14px}
.miss-g{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.secgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;align-items:start}
.acards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.acard{border:0;border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:12px;text-align:left;color:var(--ink);width:100%;min-width:0}
.mtab td.mc{text-align:center;font-family:var(--f-mono);font-size:12.5px;font-weight:700;border:2px solid var(--surface);border-radius:8px;padding:6px 4px;min-width:38px}
.mtab td.mc:not([class*=g-]){color:var(--muted)}
.acard[data-taud]{cursor:pointer}
.acard[data-taud]:hover{outline:2px solid var(--line)}
.acard.sel{outline:3px solid var(--brand);outline-offset:1px}
.acard .ah{display:flex;align-items:center;gap:10px}
.acard .si{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:#fff;flex:none}
.acard .b{flex:1;min-width:0}.acard .t1{font-weight:700;font-size:14.5px}.acard .t2{font-size:12px;color:var(--muted)}
.acard .am{display:flex;align-items:center;justify-content:space-between;gap:12px}
.aimg{border-radius:14px;object-fit:cover;flex:none;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.gtag{border-radius:12px;padding:8px 12px;text-align:center;display:flex;flex-direction:column;line-height:1.2}
.gtag b{font-family:var(--f-display);font-size:17px}.gtag span{font-size:11.5px;opacity:.85}
.ov.center{align-items:center;padding:16px}
.ov.center .sheet{border-radius:22px;max-height:90%;max-width:520px}
.acard .big{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1}
.acard .big small{font-size:16px;color:var(--muted)}
.tbars{flex:1;display:flex;align-items:flex-end;gap:5px;height:58px;min-width:0}
.tb{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px}
.tb i{display:block;width:100%;max-width:16px;border-radius:4px 4px 2px 2px;opacity:.55}
.tb span{font-size:10px;color:var(--muted);line-height:1}
.acard .af{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12.5px;border-top:1px solid rgba(0,0,0,.07);padding-top:9px}
/* ---------- Pills & status ---------- */
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:700;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.nodot::before{display:none}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.p-off{background:var(--surface2);color:var(--muted)}
.grade{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:20px;flex:none}
.g-A{background:var(--ok-soft);color:var(--ok)} .g-B{background:var(--brand-soft);color:var(--brand)} .g-C{background:var(--warn-soft);color:var(--warn)} .g-D{background:var(--bad-soft);color:var(--bad)} .g-x{background:var(--surface2);color:var(--muted)}

/* ---------- KPI ---------- */
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;min-width:0}
.kpi .v{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1.1;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:15px;color:var(--muted);font-weight:600}
.kpi .d{font-size:12.5px;color:var(--muted);margin-top:4px}

/* week strip */
.weeks{display:flex;gap:8px;flex-wrap:wrap}
.wk{flex:1;min-width:58px;border-radius:12px;padding:10px 8px;text-align:center;border:1px solid var(--line)}
.wk b{display:block;font-family:var(--f-display);font-size:15px}
.wk span{font-size:11.5px;color:var(--muted)}
.wk.ok{background:var(--ok-soft);border-color:transparent} .wk.ok b{color:var(--ok)}
.wk.bad{background:var(--bad-soft);border-color:transparent} .wk.bad b{color:var(--bad)}
.wk.now{outline:2px solid var(--brand);outline-offset:1px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{border-radius:10px;padding:8px 0;text-align:center;background:var(--surface2);font-size:12px;color:var(--muted)}
.day b{display:block;font-size:14px;color:var(--ink);font-variant-numeric:tabular-nums}
.day.has{background:var(--ok-soft)} .day.has b{color:var(--ok)}
.day.today{outline:2px solid var(--brand);outline-offset:-2px}

/* bars */
.bars{display:flex;flex-direction:column;gap:11px}
.bar-row{display:grid;grid-template-columns:minmax(0,1fr) 54px;gap:4px 10px;align-items:center}
.bar-row .lbl{font-size:13.5px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row .val{font-family:var(--f-mono);font-size:13px;text-align:right;grid-row:1/3;grid-column:2}
.track{height:9px;border-radius:9px;background:var(--surface2);overflow:hidden}
.track i{display:block;height:100%;border-radius:9px}
.c-A{background:var(--ok)} .c-B{background:var(--brand)} .c-C{background:var(--warn)} .c-D{background:var(--bad)}

/* list items */
.list{display:flex;flex-direction:column;gap:10px}
.li{display:flex;gap:12px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;width:100%;text-align:left;color:var(--ink)}
.li:hover{border-color:var(--brand)}
.li .b{flex:1;min-width:0}
.li .ttl{font-weight:700;font-size:15px}
.li .sub{font-size:13px;color:var(--muted);margin-top:2px}
.li .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.empty{text-align:center;padding:28px 16px;color:var(--muted);border:1px dashed var(--line);border-radius:16px}

/* ---------- Entry form ---------- */
.progress{display:flex;align-items:center;gap:12px}
.progress .track{flex:1;height:10px}
.progress .track i{background:var(--ok)}
.legend{width:100%;border-collapse:collapse;font-size:13.5px}
.legend td{padding:7px 8px;border-top:1px solid var(--line);vertical-align:top}
.legend td:first-child{font-family:var(--f-mono);font-weight:700;width:46px}
details.explain summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.explain summary::-webkit-details-marker{display:none}
details.explain summary::after{content:"Tunjuk";font-size:13px;color:var(--brand)}
details.explain[open] summary::after{content:"Sembunyi"}
.formula{background:var(--surface2);border-radius:12px;padding:12px;font-size:13.5px;margin-top:10px}
.sec{border:1px solid var(--line);border-radius:16px;background:var(--surface);overflow:hidden}
.sec-h{width:100%;border:0;background:transparent;display:flex;align-items:center;gap:12px;padding:14px;text-align:left;color:var(--ink)}
.sec-h .num{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;flex:none}
.st-red .num{background:var(--bad-soft);color:var(--bad)}
.st-yellow .num{background:var(--warn-soft);color:var(--warn)}
.st-green .num{background:var(--ok-soft);color:var(--ok)}
.st-green{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.st-yellow{border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
.st-red{border-color:color-mix(in srgb,var(--bad) 30%,var(--line))}
.sec-h .nm{flex:1;min-width:0;font-weight:700}
.sec-h .nm small{display:block;font-weight:500;color:var(--muted);font-size:12.5px;margin-top:1px}
.chev{transition:transform .2s;color:var(--muted);flex:none}
.sec.open .chev{transform:rotate(180deg)}
.sec-b{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px}
.item{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.item .q{font-size:14.5px;font-weight:600}
.item .q .n{font-family:var(--f-mono);color:var(--muted);font-size:12.5px;margin-right:6px}
.item .ctl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:8px}
.item .ctl4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:520px){.item .ctl{grid-template-columns:1fr}}
.item .inp{padding:9px 11px;font-size:14px}
.sel-3{border-color:var(--ok)!important;background-color:var(--ok-soft)!important}
.sel-2{border-color:var(--brand)!important;background-color:var(--brand-soft)!important}
.sel-1{border-color:var(--warn)!important;background-color:var(--warn-soft)!important}
.sel-0{border-color:var(--bad)!important;background-color:var(--bad-soft)!important}
.sel-TK{background-color:var(--surface2)!important}
.issue-tag{font-size:12px;font-weight:700;color:var(--bad)}
.secnote{font-size:13px;color:var(--muted);font-style:italic}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.ph{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface2);position:relative;display:flex;flex-direction:column}
.ph img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;max-width:100%}
.ph input{border:0;border-top:1px solid var(--line);border-radius:0;padding:7px 8px;font-size:12.5px;background:var(--surface)}
.ph .x{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:8px;border:0;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center}
.ph .up{position:absolute;left:6px;top:6px;font-size:11px;background:rgba(0,0,0,.6);color:#fff;border-radius:6px;padding:2px 6px}
.phbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.scorebox{display:flex;align-items:center;gap:14px}
.scorebox .big{font-family:var(--f-display);font-weight:800;font-size:38px;line-height:1;font-variant-numeric:tabular-nums}
.savebar{position:static;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.savebar .grow{flex:1;min-width:140px}

/* ---------- Bottom nav ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar .in{max-width:960px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabbar button{border:0;background:transparent;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
.tabbar button.on{color:var(--brand)}
.tabbar button.on svg{background:var(--brand-soft);border-radius:10px}
.tabbar svg{width:44px;height:28px;padding:4px 12px}

/* ---------- Tables ---------- */
.tbl-wrap{overflow-x:auto;margin:0 -2px}
table.t{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
table.t th{text-align:left;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t td.num{font-family:var(--f-mono);text-align:right}
.heat td.h{text-align:center;font-family:var(--f-mono);font-size:12.5px;font-weight:700;border:2px solid var(--surface);border-radius:8px}

/* ---------- Modal ---------- */
.ov{position:fixed;inset:0;z-index:50;background:rgba(8,20,18,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:92%;overflow-y:auto;overflow-x:hidden;border-radius:22px 22px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:760px){.ov{align-items:center}.sheet{border-radius:22px;max-height:88%}}
.sheet-h{position:sticky;top:0;background:var(--bg);padding:16px 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);z-index:2}
.sheet-h h2{flex:1;font-size:18px}
.sheet-b{padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.sheet-b > *{min-width:0;max-width:100%}
.sheet .scorebox{flex-wrap:wrap}
.sheet .pill{white-space:normal}
.x-btn{border:0;background:var(--surface2);width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--ink)}

#netbar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:26;font-size:13px;line-height:1.35;padding:9px max(16px,env(safe-area-inset-right,0px)) 9px max(16px,env(safe-area-inset-left,0px));text-align:center}
#netbar.off{background:#3A3012;color:#FCE9B0}
#netbar.sync{background:var(--brand-soft);color:#0B6B41}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:120;background:var(--ink);color:var(--surface);padding:11px 18px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

/* ---------- Report ---------- */
.report{background:#fff;color:#111;border-radius:14px;padding:22px;border:1px solid var(--line);font-size:13px}
.report h1{font-size:20px;color:#0E3B36}
.report h3{font-size:14px;margin:18px 0 8px;color:#0E3B36;border-bottom:2px solid #0E3B36;padding-bottom:4px}
.report table{width:100%;border-collapse:collapse;font-size:12.5px}
.report th,.report td{border:1px solid #c9d3d0;padding:6px 7px;text-align:left;vertical-align:top}
.report th{background:#e7efed}
.report .rh{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:3px solid #0E3B36;padding-bottom:10px;margin-bottom:12px}
.report .rk{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.report .rk div{border:1px solid #c9d3d0;border-radius:8px;padding:8px}
.report .rk b{display:block;font-size:20px;font-family:var(--f-display)}
.report .rph{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.report .rph figure{margin:0;border:1px solid #c9d3d0;border-radius:6px;overflow:hidden}
.report .rph img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.report .rph figcaption{padding:4px 6px;font-size:11px}
.report .tn{width:56px;height:42px;object-fit:cover;border-radius:4px;margin:2px;border:1px solid #c9d3d0;vertical-align:middle}
.report .gA{color:#1C7A47;font-weight:800}.report .gB{color:#0B6E5F;font-weight:800}.report .gC{color:#9A6E00;font-weight:800}.report .gD{color:#B23030;font-weight:800}
.report .sig{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:30px}
.report .sig div{border-top:1px solid #333;padding-top:6px;font-size:12px}
.rep-wrap{overflow-x:auto}
@media print{
  body{background:#fff}
  body *{visibility:hidden}
  .report,.report *{visibility:visible}
  .report{position:absolute;left:0;top:0;width:100%;border:0;padding:0}
  .tabbar,.top,.savebar{display:none}
  @page{size:A4;margin:12mm}
}
</style>

async function doLogin(ev){
  ev.preventDefault();
  if(!DEMO && !navigator.onLine){ toast('Tiada internet. Log masuk memerlukan internet; selepas log masuk, audit boleh dibuat tanpa internet.', 6000); return; }
  const btn = $('#lgBtn'); btn.disabled = true; btn.textContent = 'Menyemak…';
  const slow = setTimeout(() => { if(btn.disabled) btn.textContent = 'Menyambung ke pelayan… (kali pertama boleh ambil 10–20 saat)'; }, 4000);
  try{
    if(S.loginTab === 'staff'){
      const password = $('#lgIc').value, ward = $('#lgWard').value;
      if(!S.loginBld) throw new Error('Sila pilih bangunan (Main Building / WCC).');
      if(!ward) throw new Error('Sila pilih wad.');
      const r = await api('login', {ward, password});
      if($('#lgRem').checked) store('smartn_remember', {ward, bld:S.loginBld}); else storeDel('smartn_remember');
      Object.assign(S, {token:r.token, user:r.user, role:'staff', ward, screen:'home'});
    } else {
      const r = await api('coordLogin', {username:$('#lgUser').value.trim(), password:$('#lgPass').value});
      Object.assign(S, {token:r.token, user:r.user, role:'coord', ward:null, screen:'coord', tab:'dash', audit:'all'});
    }
    btn.textContent = 'Memuatkan data…';
    saveSess(); await loadEntries(); flushQueue(); clearTimeout(slow); S.showPw=false; S.showRemind=false; render(); window.scrollTo(0,0);
  }catch(e){ clearTimeout(slow); toast(e.message, 6000); S.cfgError = e.message; btn.disabled=false; btn.textContent='Log Masuk'; const keep = {u:$('#lgUser')?.value, w:$('#lgWard')?.value}; render(); if($('#lgUser')) $('#lgUser').value = keep.u||''; if($('#lgWard')&&keep.w) $('#lgWard').value = keep.w; }
}

function weekInfo(list, ref=today()){
  const m = monday(ref), end = addDays(m,7);
  return list.filter(e => { const d = parseISO(e.date); return d >= m && d < end; });
}
function monthEntries(list, mk){ return list.filter(e => e.date.slice(0,7) === mk); }
function weeksOfMonth(mk){
  const [y,m] = mk.split('-').map(Number); const first = new Date(y,m-1,1), last = new Date(y,m,0);
  const out=[]; let w = monday(first);
  while(w <= last){ out.push({start:w, end:addDays(w,6)}); w = addDays(w,7); }
  return out;
}

function vCombinedTrend(sums){
  const year = S.trendYear || today().getFullYear(), f = S.trendAud || 'all';
  const avail = sums.filter(x => x.sm);
  if(!avail.length) return '';
  const ser = avail.filter(x => f==='all' || x.a.id===f).map(x => ({a:x.a, real:x.sm.real, data:monthlySeries(x.a.id, S.ward, year)}));
  const mob = window.innerWidth < 640;
  const W = mob ? 370 : 560, H = mob ? 280 : 250, L=28, Rr=14, T=24, B=26, lo=50;
  const x = i => L + i*(W-L-Rr)/11, y = v => T + (100-Math.max(lo,v))/(100-lo)*(H-T-B);
  const ends = ser.map(sr => { let li = -1; sr.data.forEach((v,i)=>{ if(v!=null) li=i; }); return {id:sr.a.id, y: li>=0 ? y(sr.data[li]) : null}; }).filter(e=>e.y!=null).sort((p,q)=>p.y-q.y);
  for(let i=1;i<ends.length;i++) if(ends[i].y - ends[i-1].y < 13) ends[i].y = ends[i-1].y + 13;
  const labY = Object.fromEntries(ends.map(e=>[e.id,e.y]));

}

async function compress(file){
  const url = await new Promise((res,rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); });
  const img = await new Promise((res,rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = url; });
  const M = 1100, sc = Math.min(1, M/Math.max(img.width, img.height));
  const cv = document.createElement('canvas'); cv.width = Math.round(img.width*sc); cv.height = Math.round(img.height*sc);
  cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
  return cv.toDataURL('image/jpeg', 0.72);
}

async function setFix(key, done){
  const [eid, iid] = key.split('|');
  const e = S.entries.find(x => x.id === eid); if(!e) return;
  const r = e.answers[iid];
  const btn = document.querySelector(`[data-fix="${key}"]`);
  let res;
  try{
    if(done){
      const note = (S.fixNote[key] || '').trim();
      if(!note){ toast('Sila tulis tindakan pembetulan yang diambil.'); return; }
      if(btn) btn.disabled = true;
      const stage = (S.fixStage[key] || []).map(f => ({id:f.id, name:f.name, type:f.type, data:f.data}));
      r.fix = 'done'; r.fixNote = note; r.fixBy = S.ward; r.fixAt = iso(today()); r.fixFiles = (r.fixFiles||[]).concat(stage);
      delete S.fixStage[key]; delete S.fixNote[key];
    } else { delete r.fix; S.fixNote[key] = r.fixNote || ''; delete r.fixNote; }
    res = await persistEntry(e, t => { if(btn) btn.textContent = t; });
    if(!res.queued){ const i = S.entries.findIndex(x => x.id === eid); if(i>=0) S.entries[i] = res.entry; }
    toast(res.queued ? 'Tiada internet — tindakan disimpan dalam telefon dan akan dihantar automatik.' : done ? 'Tindakan pembetulan disimpan' : 'Dibuka semula — kemaskini tindakan', res.queued ? 5000 : 2600);
  }catch(err){ toast('Gagal simpan: '+err.message); if(btn){ btn.disabled=false; btn.textContent='Cuba lagi'; } return; }
  if($('#modal').innerHTML) openDetail(eid);
  render();
}

async function onEvFiles(files){
  if(!files || !files.length || !evTarget) return;
  const key = evTarget, arr = S.fixStage[key] = S.fixStage[key] || [];
  const LIM = (DEMO ? 6 : 25) * 1024 * 1024;
  for(const f of files){
    try{
      if(f.type.startsWith('image/')) arr.push({id:uid('B'), name:f.name || 'gambar.jpg', type:'image/jpeg', data: await compress(f)});
      else {
        if(f.size > LIM){ toast(`${f.name} terlalu besar (maks ${LIM/1048576} MB).`); continue; }
        const data = await new Promise((res,rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(f); });
        arr.push({id:uid('B'), name:f.name, type:f.type || 'application/octet-stream', data});

    }catch(e){ toast('Fail tidak dapat dibaca: '+f.name); }
  }
  rerenderFix(key);
}

  const list = monthEntries(wardEntries(ward), mk).sort((a,b)=>a.date.localeCompare(b.date));
  const p = avg(scored(list).map(e=>e.pct)); const weeks = weeksOfMonth(mk);
  const wkDone = weeks.filter(w => list.some(e => { const d=parseISO(e.date); return d>=w.start && d<=w.end; })).length;
  const agg = sectionAgg(list);
  const issues = list.flatMap(e => calc(e).secs.flatMap(s => s.issues.map(is => ({...is, e}))));
  const photos = list.flatMap(e => Object.entries(e.photos||{}).flatMap(([k,arr]) => (arr||[]).map(ph => ({ph, ...keyInfo(k), e})))).slice(0,24);
  const msum = id => list.reduce((a,e)=>a+(+((e.meta||{})[id])||0),0);
  let metaK = '';
  if(tp.id==='phleb'){ const k = msum('kanula'), ph = msum('phleb'); metaK = `<div>Kanula diaudit<b>${k}</b></div><div>Phlebitis (VIP ≥ 2)<b>${ph}</b></div><div>Insiden phlebitis<b style="color:${k&&ph/k*100>5?'#B23030':'#1C7A47'}">${k?(ph/k*100).toFixed(1)+'%':'—'}</b><span style="font-size:10.5px">standard ≤ 5%</span></div>`; }
  if(tp.id==='fall'){ metaK = `<div>Pesakit diaudit<b>${msum('pesakit')}</b></div><div>Risiko tinggi (MFS > 45)<b>${msum('tinggi')}</b></div>`; }
  return `<div class="rk"><div>Bil. audit<b>${list.length}</b></div><div>Minggu diaudit<b>${wkDone}/${weeks.length}</b></div><div>Purata skor<b>${pctTxt(p)}</b></div><div>Gred<b class="${gCls(gradeOf(p))}">${gradeOf(p)}</b></div><div>Belum diperbetulkan<b>${issues.filter(i=>i.r.fix!=='done').length}</b></div><div>Sudah diperbetulkan<b>${issues.filter(i=>i.r.fix==='done').length}</b></div>${metaK}</div>
    <h3>Senarai audit</h3>
    ${list.length?`<table><thead><tr><th>Tarikh</th><th>Masa</th><th>Juruaudit</th><th>Seksyen</th><th>Skor</th><th>Gred</th><th>Status</th></tr></thead><tbody>${list.map(e=>`<tr><td>${fmtD(e.date)}</td><td>${esc(e.time)}</td><td>${esc(e.auditor)}</td><td>${e.done}/${tp.sections.length}</td><td>${pctTxt(e.pct)}</td><td class="${gCls(e.grade)}">${e.grade}</td><td>${e.status}</td></tr>`).join('')}</tbody></table>`:'<p>Tiada audit dalam bulan ini.</p>'}
    <h3>Pematuhan mengikut seksyen</h3>
    <table><thead><tr><th>Bil</th><th>Seksyen</th><th>Purata</th><th>Gred</th></tr></thead><tbody>${agg.map((a,i)=>`<tr><td>${i+1}</td><td>${a.s.t}</td><td>${pctTxt(a.pct)}</td><td class="${gCls(gradeOf(a.pct))}">${gradeOf(a.pct)}</td></tr>`).join('')}</tbody></table>
    <h3>Dapatan & tindakan pembetulan</h3>
    <p style="margin:0 0 6px;font-size:11.5px;color:#4a5d58">Perkara yang mendapat markah 0 / 1${tp.id==='ipc'?' atau MISSED (5 Moment)':''} sepanjang bulan ini, beserta catatan dapatan, gambar dan status tindakan pembetulan oleh wad.</p>
    ${issues.length?`<table><thead><tr><th>Tarikh</th><th>Seksyen</th><th>Perkara</th><th>Markah</th><th>Catatan dapatan</th><th>Gambar</th><th>Status / tindakan</th></tr></thead><tbody>${issues.map(is=>`<tr><td>${fmtD(is.e.date)}</td><td>${esc(is.sec.t)}</td><td>${esc(is.txt)}</td><td>${is.sec.type==='moment'?'MISSED':is.v}</td><td>${esc(is.r.note||'')}</td><td>${thumbs(is.e, is.id)}</td><td>${is.r.fix==='done'?'Selesai'+(is.r.fixNote?': '+esc(is.r.fixNote):'')+repEv(is.r.fixFiles):'<b style="color:#B23030">Belum diperbetulkan</b>'}</td></tr>`).join('')}</tbody></table>`:'<p>Tiada dapatan bermasalah.</p>'}
    ${photos.length?`<h3>Gambar bukti</h3><div class="rph">${photos.map(x=>`<figure><img src="${x.ph.url||x.ph.data}" alt=""><figcaption><b>${esc(x.s.t)}</b> · ${fmtD(x.e.date)}${x.txt?'<br>'+esc(x.txt):''}${x.ph.remark?'<br><i>'+esc(x.ph.remark)+'</i>':''}</figcaption></figure>`).join('')}</div>`:''}
    <p style="font-size:11px;color:#4a5d58;margin-top:10px">Rujukan: ${esc(tp.source)}</p>`;
}
function repWardMonth(ward, mk, overall=false){

  if(!overall) return `<div class="report" id="report">${repHead('Laporan '+T().name, `<b>${esc(ward)}</b> · ${fmtM(mk)}`)}${repBody(ward, mk)}${sig}</div>`;
  const rows = AUDITS.map(a => { const l = monthEntries(wardEntries(ward, a.id), mk), pp = avg(scored(l).map(e=>e.pct));
    return `<tr><td><b>${a.name}</b></td><td>${l.length}</td><td>${pctTxt(pp)}</td><td class="${gCls(gradeOf(pp))}">${gradeOf(pp)}</td><td>${l.reduce((x,e)=>x+(e.openIssues||0),0)}</td></tr>`; }).join('');
  return `<div class="report" id="report">${repHead('Laporan Keseluruhan Audit Round', `<b>${esc(ward)}</b> · ${fmtM(mk)}`)}

}
function repEntry(e){ return withAudit(e.audit, () => repEntry_(e)); }

    ${c.secs.map((cs,i) => `<h3>${i+1}. ${cs.s.t} <span style="font-weight:400;font-size:12px">(${pctTxt(cs.pct)})</span></h3>
      <table><thead><tr><th style="width:52%">Perkara</th><th>Markah</th><th>Catatan</th></tr></thead><tbody>
      ${cs.s.items.map((t,k)=>{ const id=cs.s.id+'i'+(k+1), r=e.answers[id]||{}; const m = cs.s.type==='moment' ? (r.obs||'—')+(r.jawatan?' · '+r.jawatan:'') : (r.s||'—');

      ${((e.photos||{})[cs.s.id]||[]).length?`<div class="rph" style="margin-top:6px">${e.photos[cs.s.id].map(p=>`<figure><img src="${p.url||p.data}" alt=""><figcaption>${esc(p.remark)}</figcaption></figure>`).join('')}</div>`:''}`).join('')}

    <table><tbody>${metaLine(e)?`<tr><th style="width:30%">Maklumat tambahan</th><td>${metaLine(e)}</td></tr>`:''}<tr><th style="width:30%">Audit oleh</th><td>${esc(e.auditor)}</td></tr><tr><th>Tarikh & masa</th><td>${fmtD(e.date)} · ${esc(e.time)}</td></tr><tr><th>Saksi / Nama staf Y/M</th><td>${esc(e.saksi)}</td></tr><tr><th>Ulasan</th><td>${esc(e.ulasan)}</td></tr></tbody></table>
    <p style="font-size:11.5px;margin-top:10px">Gred: A 90–100% · B 80–89% · C 70–79% · D bawah 70%</p>
  </div>`;
}
function wardRows(mk){
  const all = wardEntries(null), now = today();
  const used = new Set(wardEntries(null).map(e=>e.ward));
  return coordWards().filter(w => S.audit==='ipc' || used.has(w) || !used.size).map(w => {
    const l = all.filter(e => e.ward === w), mo = monthEntries(l, mk), p = avg(scored(mo).map(e=>e.pct));
    const last = [...l].sort((a,b)=>b.date.localeCompare(a.date))[0];
    return {w, wk:weekInfo(l).length, n:mo.length, p, g:gradeOf(p), open:l.reduce((a,e)=>a+(e.openIssues||0),0), last:last?last.date:null, drafts:l.filter(e=>e.status==='Draf').length};
  });
}

function summaryText(){
  if(S.screen==='oreport'){
    return `*SMART N Manager — Laporan Keseluruhan*\n${S.ward} · ${fmtM(S.repMonth)}\n\n` + AUDITS.map(a => { const l = monthEntries(wardEntries(S.ward, a.id), S.repMonth), p = avg(scored(l).map(e=>e.pct));
      return `• ${a.name}: ${l.length} audit, ${pctTxt(p)} (Gred ${gradeOf(p)}), belum diperbetulkan ${l.reduce((x,e)=>x+(e.openIssues||0),0)}`; }).join('\n');
  }
  if(S.repEntry){ const e = S.entries.find(x=>x.id===S.repEntry); const c = calc(e);
    return `*SMART N Manager — ${tplOf(e).name}*\n${e.ward}\n${fmtD(e.date)} ${e.time}\nSkor: ${pctTxt(c.pct)} (Gred ${c.grade})\nSeksyen: ${c.done}/${tplOf(e).sections.length} · Dapatan belum diperbetulkan: ${c.open}\nAudit oleh: ${e.auditor}`; }
  const coord = S.role==='coord', ward = coord ? S.repWard : S.ward;
  if(coord && S.audit==='all'){ const W = ward || null; return `*SMART N Manager — Semua Audit · ${W||'Semua Wad'} (${fmtM(S.repMonth)})*\n` + AUDITS.map(a => { const l = monthEntries(wardEntries(W, a.id), S.repMonth), pp = avg(scored(l).map(e=>e.pct)); return `• ${a.name}: ${l.length} audit, ${pctTxt(pp)} (Gred ${gradeOf(pp)}), belum diperbetulkan ${l.reduce((x,e)=>x+(e.openIssues||0),0)}`; }).join('\n'); }
  if(coord && !ward){ const rows = wardRows(S.repMonth); return `*${T().name} — Semua Wad (${fmtM(S.repMonth)})*\n`+rows.map(r=>`• ${r.w}: ${r.n} audit, ${pctTxt(r.p)} (${r.g}), belum diperbetulkan ${r.open}`).join('\n'); }
  const list = monthEntries(wardEntries(ward), S.repMonth); const p = avg(scored(list).map(e=>e.pct));
  const f = findingsOf(list).slice(0,3);
  return `*${T().name} — ${ward}*\n${fmtM(S.repMonth)}\nBil. audit: ${list.length}\nPurata: ${pctTxt(p)} (Gred ${gradeOf(p)})\nDapatan belum diperbetulkan: ${list.reduce((a,e)=>a+(e.openIssues||0),0)}${f.length?'\nDapatan utama:\n'+f.map(x=>'• '+x.txt).join('\n'):''}`;
}

    <table><thead><tr><th>Wad</th>${AUDITS.map(a=>`<th>${TPL[a.id].short}</th>`).join('')}<th>Purata</th></tr></thead><tbody>${matrix}</tbody></table>
    ${tops}${sig}</div>`;
}
function vCoordDash(){
  const mk = S.dashMonth, rows = wardRows(mk), all = wardEntries(null).filter(e => S.cBld==='all' || bldOf(e.ward)===S.cBld), mo = monthEntries(all, mk);
  const p = avg(scored(mo).map(e=>e.pct)), wkDone = rows.filter(r=>r.wk).length;
  const missing = rows.filter(r=>!r.wk);
  const sorted = [...rows].sort((a,b)=>(a.p??-1)-(b.p??-1));
  const months = []; for(let i=5;i>=0;i--){ const d = new Date(+mk.slice(0,4), +mk.slice(5)-1-i, 1); months.push(monthKey(d)); }
  const cellBg = g => g==='A'?'var(--ok-soft)':g==='B'?'var(--brand-soft)':g==='C'?'var(--warn-soft)':g==='D'?'var(--bad-soft)':'var(--surface2)';
  const cellFg = g => g==='A'?'var(--ok)':g==='B'?'var(--brand)':g==='C'?'var(--warn)':g==='D'?'var(--bad)':'var(--muted)';
  return `<div class="stack">
    ${S.audit==='ipc' ? `<img class="hbanner" src="${IMG.audit}" alt="Monitoring & Audit">` : vModBanner()}
    <div class="row" style="justify-content:space-between"><div><div class="eyebrow">Pemantauan pematuhan</div><h2 style="font-size:22px">${S.cBld==='all'?'Semua wad':BLD_LABEL[S.cBld]} · ${T().short}</h2></div>
      <div class="row"><select class="inp" style="width:auto" id="coordAudit" aria-label="Jenis audit"><option value="all" ${S.audit==='all'?'selected':''}>Semua audit</option>${AUDITS.map(a=>`<option value="${a.id}" ${S.audit===a.id?'selected':''}>${a.name}</option>`).join('')}</select>
      <input type="month" class="inp" id="dashMonth" value="${mk}" style="width:auto"></div></div>
    ${bldChips()}
    <div class="grid4">
      <div class="kpi"><div class="eyebrow">Wad diaudit minggu ini</div><div class="v">${wkDone}<small>/${rows.length}</small></div><div class="d">${missing.length} wad belum</div></div>
      <div class="kpi"><div class="eyebrow">Audit bulan ini</div><div class="v">${mo.length}</div><div class="d">${fmtM(mk)}</div></div>
      <div class="kpi"><div class="eyebrow">Purata hospital</div><div class="v">${p==null?'—':Math.round(p)}<small>${p==null?'':'%'}</small></div><div class="d">Gred ${gradeOf(p)}</div></div>
      <div class="kpi"><div class="eyebrow">Dapatan belum diperbetulkan</div><div class="v" style="color:var(--bad)">${rows.reduce((a,r)=>a+r.open,0)}</div><div class="d">Semua wad</div></div>
    </div>
    <div class="card"><div class="card-h"><h2>Belum audit minggu ini</h2><span class="small muted">${fmtD(iso(monday(today())))} – ${fmtD(iso(addDays(monday(today()),6)))}</span></div>
      ${missing.length ? `<div class="miss-sum"><div><span class="miss-n">${missing.length}</span><span class="muted"> / ${rows.length} tempat belum diaudit</span></div>
        <div class="chips">${['Main','WCC'].map(b => { const n = missing.filter(r=>bldOf(r.w)===b).length; return n ? `<span class="pill p-bad nodot">${BLD_LABEL[b]}: ${n}</span>` : ''; }).join('')}</div></div>
        <details class="miss-dd"><summary>Lihat senarai tempat (${missing.length})</summary>
          ${['Main','WCC'].map(b => { const l = missing.filter(r=>bldOf(r.w)===b); return l.length ? `<div class="miss-g"><div class="eyebrow">${BLD_LABEL[b]} · ${l.length}</div><div class="chips">${l.map(r=>`<button class="pill p-bad" style="border:0" data-wardlist="${esc(r.w)}" title="Lihat entry ${esc(r.w)}">${esc(r.w)}</button>`).join('')}</div></div>` : ''; }).join('')}
        </details>` : `<div class="chips"><span class="pill p-ok">Semua tempat telah diaudit minggu ini</span></div>`}</div>
    <div class="card"><div class="card-h"><h2>Pematuhan mengikut wad</h2><span class="small muted">Disusun dari skor terendah</span></div>
      <div class="tbl-wrap"><table class="t"><thead><tr><th>Wad</th><th>Minggu ini</th><th style="text-align:right">Audit</th><th style="text-align:right">Purata</th><th>Gred</th><th style="text-align:right">Belum diperbaiki</th><th>Terakhir</th></tr></thead><tbody>
      ${sorted.map(r=>`<tr><td><button class="linkbtn" style="color:var(--ink);text-align:left" data-wardlist="${esc(r.w)}">${esc(r.w)}</button></td><td>${r.wk?'<span class="pill p-ok">Sudah</span>':'<span class="pill p-bad">Belum</span>'}</td><td class="num">${r.n}</td><td class="num">${pctTxt(r.p)}</td><td><span class="grade g-${r.g==='–'?'x':r.g}" style="width:30px;height:30px;font-size:15px;border-radius:9px">${r.g}</span></td><td class="num" style="color:${r.open?'var(--bad)':'inherit'}">${r.open}</td><td class="small">${fmtD(r.last)}</td></tr>`).join('')}
      </tbody></table></div></div>
    <div class="card"><div class="card-h"><h2>Peta haba pematuhan · 6 bulan</h2><span class="small muted">Purata % bulanan</span></div>
      <div class="tbl-wrap"><table class="t heat"><thead><tr><th>Wad</th>${months.map(m=>`<th style="text-align:center">${BLN[+m.slice(5)-1]}</th>`).join('')}</tr></thead><tbody>
      ${coordWards().map(w=>`<tr><td style="white-space:nowrap">${esc(w)}</td>${months.map(m=>{ const v = avg(scored(monthEntries(all.filter(e=>e.ward===w), m)).map(e=>e.pct)); const g = gradeOf(v); return `<td class="h" style="background:${cellBg(g)};color:${cellFg(g)}">${v==null?'—':Math.round(v)}</td>`; }).join('')}</tr>`).join('')}
      </tbody></table></div>
      <div class="chips" style="margin-top:10px"><span class="pill p-ok">A ≥90</span><span class="pill" style="background:var(--brand-soft);color:var(--brand)">B 80–89</span><span class="pill p-warn">C 70–79</span><span class="pill p-bad">D &lt;70</span></div></div>
    ${vSectionBars(mo, 'Pematuhan seksyen · seluruh hospital')}
    ${vTopFindings(mo)}
  </div>`;
}
function vUsers(){
  return `<div class="stack">
    <div><div class="eyebrow">Pengurusan</div><h2 style="font-size:22px">Wad & kata laluan</h2>
      <p class="small muted" style="margin:4px 0 0">Setiap wad ada satu kata laluan yang dikongsi oleh semua staf wad itu. Nama juruaudit diisi dalam setiap entry.</p></div>
    <form class="card stack" id="userForm"><h2>Tambah wad / tukar kata laluan</h2>

        <label class="f">Nama wad<input class="inp" id="uWard" required list="wardList" placeholder="cth: Wad 3 Surgeri Lelaki"><datalist id="wardList">${S.wards.map(w=>`<option value="${esc(w)}">`).join('')}</datalist></label>

      ${S.users.length?`<div class="tbl-wrap"><table class="t"><thead><tr><th>Wad</th><th>Bangunan</th><th>Kata laluan</th><th></th></tr></thead><tbody>
      ${S.users.filter(u => S.cBld==='all' || (u.bld||'Main')===S.cBld).map(u=>`<tr><td><b>${esc(u.ward)}</b></td><td class="small">${BLD_LABEL[u.bld||'Main']}</td><td class="mono small">${esc(u.password)||'<span class="muted">belum ditetapkan</span>'}</td><td style="text-align:right;white-space:nowrap"><button class="btn sm ghost" data-editward="${esc(u.ward)}">Tukar</button> ${S.delUser===u.ward?`<button class="btn sm danger" data-deluser="${esc(u.ward)}">Sahkan padam</button>`:`<button class="btn sm ghost" data-askdel="${esc(u.ward)}">Padam</button>`}</td></tr>`).join('')}
      </tbody></table></div>`:`<div class="empty">Memuatkan senarai…</div>`}</div>
  </div>`;
}
async function loadUsers(){ try{ const r = await api('listWardsAdmin'); S.users = r.wards||[]; S.wards = S.users.map(x=>x.ward); S.users.forEach(u => S.wardBld[u.ward] = u.bld || 'Main'); }catch(e){ toast(e.message); } if(S.tab==='users') render(); }

/* ---------- Events ---------- */
function bind(){
  const lf = $('#loginForm'); if(lf) lf.addEventListener('submit', doLogin);
  const uf = $('#userForm'); if(uf) uf.addEventListener('submit', async ev => { ev.preventDefault();
    const ward = $('#uWard').value.trim(), password = $('#uPass').value.trim(), bld = $('#uBld').value;
    if(password.length < 4){ toast('Kata laluan sekurang-kurangnya 4 aksara.'); return; }
    try{ await api('saveWard', {ward, password, bld}); toast('Disimpan: '+ward); loadUsers(); }catch(e){ toast(e.message); } });
}
document.addEventListener('click', async ev => {
  const t = ev.target.closest('[data-go],button,[data-close],[data-taud]'); if(!t) return;
  const d = t.dataset;
  if(d.close2 && (t.tagName==='BUTTON' || ev.target === t)){ $('#modal2').innerHTML = ''; return; }
  if(d.close && (t.tagName==='BUTTON' || ev.target === t)){ $('#modal').innerHTML = ''; return; }
  if(d.ltab){ S.loginTab = d.ltab; S.showRemind=false; render(); return; }
  if(d.bld){ const pw = $('#lgIc')?.value || ''; S.loginBld = d.bld; render(); if($('#lgIc')) $('#lgIc').value = pw; return; }
  if(d.cbld){ S.cBld = d.cbld; render(); return; }
  if(d.tab){ S.tab = d.tab; if(d.tab!=='report') S.repEntry = null; if(d.tab==='users') loadUsers(); render(); window.scrollTo(0,0); return; }
  if(d.go){ $('#modal').innerHTML=''; if(S.draft && S.draft.audit !== d.go){ S.draft = null; S.openSec = null; } S.audit = d.go; S.repEntry = null; S.screen = S.role==='coord' ? 'coord' : 'module'; S.tab='dash'; render(); window.scrollTo(0,0); return; }
  if(d.hnav){ if(d.hnav==='audit'){ openRounds(); return; } $('#modal').innerHTML=''; S.screen = d.hnav==='report' ? 'oreport' : d.hnav; render(); window.scrollTo(0,0); return; }
  if(d.menu){ const m = d.menu;
    if(m==='safety') openRounds();
    else { if(m==='monitor') S.screen='overall'; if(m==='audit'){ S.screen='module'; S.tab='entry'; } if(m==='respons'){ S.screen='notif'; S.notifTab='open'; } if(m==='tracking'){ S.screen='module'; S.tab='list'; } if(m==='settings') S.screen='settings'; render(); window.scrollTo(0,0); }
    return; }
  if(d.nt){ S.notifTab = d.nt; render(); return; }
  if(d.taud && !ev.target.closest('[data-go]')){ S.trendAud = (S.trendAud===d.taud && t.classList.contains('acard')) ? 'all' : d.taud; const y = window.scrollY; render(); window.scrollTo(0,y); if(t.classList.contains('acard')) $('#trendCard')?.scrollIntoView({behavior:'smooth', block:'center'}); return; }
  if(d.evcam){ evTarget = d.evcam; $('#evCam').value=''; $('#evCam').click(); return; }
  if(d.evgal){ evTarget = d.evgal; $('#evGal').value=''; $('#evGal').click(); return; }
  if(d.evfile){ evTarget = d.evfile; $('#evFile').value=''; $('#evFile').click(); return; }
  if(d.evrm){ const [e,i,f] = d.evrm.split('|'); const k = e+'|'+i; S.fixStage[k] = (S.fixStage[k]||[]).filter(x=>x.id!==f); rerenderFix(k); return; }
  if(d.evview){ viewEvidence(d.evview); return; }
  if(d.sec){ S.openSec = S.openSec === d.sec ? null : d.sec; rerenderSections(); const el = $('#sec-'+d.sec); if(el && S.openSec) el.scrollIntoView({block:'start', behavior:'smooth'}); return; }
  if(d.next){ const i = T().sections.findIndex(s=>s.id===d.next); S.openSec = T().sections[i+1].id; rerenderSections(); $('#sec-'+S.openSec).scrollIntoView({block:'start', behavior:'smooth'}); return; }
  if(d.cam){ photoTarget = d.cam; $('#fileCam').value=''; $('#fileCam').click(); return; }
  if(d.gal){ photoTarget = d.gal; $('#fileGal').value=''; $('#fileGal').click(); return; }
  if(d.delph){ const [s,id] = d.delph.split('|'); S.draft.photos[s] = S.draft.photos[s].filter(p=>p.id!==id); refreshEntry(); return; }
  if(d.open){ openDetail(d.open); return; }
  if(d.fix){ setFix(d.fix, true); return; }
  if(d.reopen){ setFix(d.reopen, false); return; }
  if(d.edit){ const e = S.entries.find(x=>x.id===d.edit); S.audit = e.audit || 'ipc'; S.screen = 'module'; S.draft = JSON.parse(JSON.stringify(e)); S.openSec = (calc(S.draft).secs.find(s=>s.state!=='green')||{s:{}}).s.id || null; S.tab='entry'; $('#modal').innerHTML=''; render(); window.scrollTo(0,0); return; }
  if(d.rep1){ const e0 = S.entries.find(x=>x.id===d.rep1); if(e0){ S.audit = e0.audit||'ipc'; } if(S.role!=='coord') S.screen='module'; S.repEntry = d.rep1; S.tab='report'; $('#modal').innerHTML=''; render(); window.scrollTo(0,0); return; }
  if(d.ls){ S.listStatus = d.ls; render(); return; }
  if(d.wardlist){ S.listWard = d.wardlist; S.listMonth = S.dashMonth; S.listStatus='all'; S.tab='list'; render(); window.scrollTo(0,0); return; }
  if(d.askdel){ S.delUser = d.askdel; render(); return; }
  if(d.deluser){ try{ await api('deleteWard',{ward:d.deluser}); S.delUser=null; toast('Wad dipadam'); loadUsers(); }catch(e){ toast(e.message); } return; }
  if(d.editward){ $('#uWard').value = d.editward; $('#uBld').value = bldOf(d.editward); $('#uPass').focus(); return; }
  switch(d.act){
    case 'togglePw': S.showPw = !S.showPw; { const keep = {u:$('#lgUser')?.value, i:$('#lgIc')?.value, p:$('#lgPass')?.value, w:$('#lgWard')?.value}; render(); if($('#lgUser')) $('#lgUser').value = keep.u||''; if($('#lgIc')) $('#lgIc').value = keep.i||''; if($('#lgPass')) $('#lgPass').value = keep.p||''; if($('#lgWard')&&keep.w) $('#lgWard').value = keep.w; } break;
    case 'remind': S.showRemind = !S.showRemind; { const keep = {u:$('#lgUser')?.value, i:$('#lgIc')?.value, p:$('#lgPass')?.value, w:$('#lgWard')?.value}; render(); if($('#lgUser')) $('#lgUser').value = keep.u||''; if($('#lgIc')) $('#lgIc').value = keep.i||''; if($('#lgPass')) $('#lgPass').value = keep.p||''; if($('#lgWard')&&keep.w) $('#lgWard').value = keep.w; } break;
    case 'fillDemo': if(S.loginTab==='staff'){ if(!S.loginBld){ S.loginBld='Main'; render(); } $('#lgIc').value='wad123'; if(!$('#lgWard').value) $('#lgWard').value = S.wards.find(w => bldOf(w)===S.loginBld); } else { $('#lgUser').value='koordinator'; $('#lgPass').value='nursing'; } break;
    case 'logout': if(NET.queue.length && !S._confirmOut){ S._confirmOut = true; toast(`${NET.queue.length} data belum dihantar. Tekan log keluar sekali lagi untuk teruskan (data kekal dalam telefon).`, 6000); break; } S._confirmOut = false; try{ localStorage.removeItem('smartn_sess'); }catch(e){} Object.assign(S,{screen:'login', role:null, user:null, token:null, draft:null, entries:[], tab:'dash', repEntry:null}); render(); break;
    case 'copyPhone': try{ await navigator.clipboard.writeText(CONFIG.CONTACT_EMAIL); toast('E-mel disalin'); }catch(e){ toast('Tekan lama e-mel untuk salin'); } break;
    case 'home': S.screen= S.role==='coord' ? 'coord' : 'home'; S.tab='dash'; render(); window.scrollTo(0,0); break;
    case 'overall': S.screen='overall'; render(); window.scrollTo(0,0); break;
    case 'newEntry': S.draft = newDraft(); S.openSec = T().sections[0].id; render(); break;
    case 'cancelDraft': S.draft = null; S.openSec = null; render(); break;
    case 'saveDraft': saveDraft(); break;
    case 'print': window.print(); break;
    case 'repMonthly': S.repEntry = null; render(); break;
    case 'copySum': { const txt = summaryText(); try{ await navigator.clipboard.writeText(txt); toast('Ringkasan disalin — tampal di WhatsApp'); }catch(e){ $('#modal').innerHTML = `<div class="ov" data-close="1"><div class="sheet"><div class="sheet-h"><h2>Salin ringkasan</h2><button class="x-btn" data-close="1">${ic('x',18)}</button></div><div class="sheet-b"><textarea class="inp mono" rows="10" id="sumTxt">${esc(txt)}</textarea><div class="small muted">Tekan lama dan salin teks di atas.</div></div></div></div>`; $('#sumTxt').select(); } } break;
  }
});
document.addEventListener('change', ev => {
  const t = ev.target, d = t.dataset;
  if(t.id === 'fileCam' || t.id === 'fileGal'){ onFiles(t.files); return; }
  if(t.id === 'evCam' || t.id === 'evGal' || t.id === 'evFile'){ onEvFiles(t.files); return; }
  if(t.id === 'cBldSel'){ S.cBld = t.value; render(); return; }
  if(t.id === 'coordAudit'){ S.audit = t.value; S.repEntry = null; render(); return; }
  if(t.id === 'trendYear'){ S.trendYear = +t.value; const y = window.scrollY; render(); window.scrollTo(0,y); return; }
  if(t.id === 'dashMonth'){ S.dashMonth = t.value || monthKey(today()); render(); return; }
  if(t.id === 'listMonth'){ S.listMonth = t.value; render(); return; }
  if(t.id === 'listWard'){ S.listWard = t.value; render(); return; }
  if(t.id === 'repMonth'){ S.repMonth = t.value || monthKey(today()); render(); return; }
  if(t.id === 'repWard'){ S.repWard = t.value; render(); return; }
  if(!S.draft) return;
  const a = S.draft.answers;
  if(d.score){ a[d.score] = {...(a[d.score]||{}), s:t.value}; if(t.value==='' ) delete a[d.score].s; refreshEntry(); return; }
  if(d.obs){ a[d.obs] = {...(a[d.obs]||{}), obs:t.value}; refreshEntry(); return; }
  if(d.jaw){ a[d.jaw] = {...(a[d.jaw]||{}), jawatan:t.value}; return; }
});
document.addEventListener('input', ev => {
  const t = ev.target, d = t.dataset;
  if(d.fxnote){ S.fixNote[d.fxnote] = t.value; return; }
  if(d.meta && S.draft){ S.draft.meta = S.draft.meta || {}; S.draft.meta[d.meta] = t.value === '' ? '' : Math.max(0, +t.value); return; }
  if(!S.draft) return;
  const a = S.draft.answers;
  if(d.note){ a[d.note] = {...(a[d.note]||{}), note:t.value}; return; }
  if(d.nama){ a[d.nama] = {...(a[d.nama]||{}), nama:t.value}; return; }
  if(d.phrem){ const [s,id] = d.phrem.split('|'); const p = S.draft.photos[s].find(x=>x.id===id); if(p) p.remark = t.value; return; }
  if(t.id==='fDate') S.draft.date=t.value; if(t.id==='fTime') S.draft.time=t.value; if(t.id==='fAud') S.draft.auditor=t.value; if(t.id==='fSaksi') S.draft.saksi=t.value; if(t.id==='fUlasan') S.draft.ulasan=t.value;
});
document.addEventListener('keydown', ev => { if(ev.key!=='Escape') return; if($('#modal2').innerHTML) $('#modal2').innerHTML=''; else if($('#modal').innerHTML) $('#modal').innerHTML=''; });

if('serviceWorker' in navigator && location.protocol === 'https:'){ navigator.serviceWorker.register('sw.js').catch(() => {}); }
boot();
